<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow-x:hidden;
    background:#05050a;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  }
  body {
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    position:relative;
  }

  /* Background glow */
  body::before, body::after {
    content:"";
    position:fixed;
    width:300px; height:300px;
    border-radius:50%;
    filter:blur(90px);
    z-index:0;
  }
  body::before { top:-80px; left:-80px; background:rgba(107,74,255,.35); }
  body::after { bottom:-80px; right:-80px; background:rgba(0,153,255,.3); }

  .card {
    position:relative;
    z-index:1;
    width:100%;
    max-width:400px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:24px;
    padding:40px 24px;
    text-align:center;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    box-shadow:0 8px 40px rgba(0,0,0,.5);
    animation:fadeIn .7s ease both;
  }
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(16px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .avatar-wrap {
    width:100px; height:100px;
    margin:0 auto 20px;
    border-radius:50%;
    animation:floatAvatar 3.6s ease-in-out infinite;
  }
  @keyframes floatAvatar {
    0%,100% { transform:translateY(0); }
    50%     { transform:translateY(-8px); }
  }
  .avatar {
    width:100px; height:100px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:2px solid rgba(140,120,255,.8);
    box-shadow:0 0 18px rgba(140,120,255,.55), 0 0 36px rgba(0,153,255,.35);
  }

  .brand-name {
    font-size:26px;
    font-weight:800;
    letter-spacing:.5px;
    background:linear-gradient(90deg,#8c78ff,#6a9bff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:8px;
  }

  .badge {
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    font-weight:700;
    letter-spacing:.5px;
    color:#8c9dff;
    background:rgba(140,120,255,.12);
    border:1px solid rgba(140,120,255,.35);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }

  .desc {
    font-size:14px;
    line-height:1.6;
    color:#b8b8c8;
    margin-bottom:8px;
    padding:0 4px;
  }

  .cta-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    margin-top:24px;
    padding:16px 20px;
    font-size:16px;
    font-weight:700;
    color:#fff;
    text-decoration:none;
    border:none;
    border-radius:14px;
    cursor:pointer;
    background:linear-gradient(90deg,#6a4cff,#3d8bff);
    box-shadow:0 0 22px rgba(106,76,255,.5);
    animation:pulse 2.4s ease-in-out infinite;
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .cta-btn:hover {
    transform:scale(1.03);
    box-shadow:0 0 32px rgba(106,76,255,.75);
  }
  .cta-btn:active { transform:scale(.97); }
  @keyframes pulse {
    0%,100% { box-shadow:0 0 22px rgba(106,76,255,.5); }
    50%     { box-shadow:0 0 34px rgba(61,139,255,.8); }
  }
  .cta-btn svg { width:20px; height:20px; flex-shrink:0; }

  .spinner-wrap {
    margin-top:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .spinner {
    width:18px; height:18px;
    border-radius:50%;
    border:2px solid rgba(140,120,255,.25);
    border-top-color:#8c78ff;
    animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .spinner-text {
    font-size:12px;
    color:#7a7a8c;
  }

  .footer {
    margin-top:22px;
    font-size:11px;
    color:#55556a;
  }
</style>
</head>
<body>

<div class="card">
  <div class="avatar-wrap">
    <img class="avatar" id="profileImg" src="PROFILE_IMAGE_URL" alt="SURYA BHAI">
  </div>

  <h1 class="brand-name">SURYA BHAI</h1>

  <div class="badge">✓ OFFICIAL COMMUNITY</div>

  <p class="desc">
    Join the SURYA BHAI community and stay connected with our latest updates and information.
  </p>

  <a href="TELEGRAM_LINK" target="_blank" rel="noopener noreferrer" class="cta-btn" id="joinBtn">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M21.2 3.6 2.9 10.7c-1.2.5-1.2 1.2-.2 1.5l4.7 1.5 1.8 5.6c.2.6.4.8.8.8.4 0 .6-.2.9-.5l2.1-2 4.4 3.2c.8.5 1.4.2 1.6-.7l3-14c.3-1.2-.4-1.7-1.8-1.5Z" fill="white"/>
    </svg>
    JOIN TELEGRAM
  </a>

  <div class="spinner-wrap">
    <div class="spinner"></div>
    <span class="spinner-text">Redirecting you now…</span>
  </div>

  <div class="footer">© 2026 SURYA BHAI</div>
</div>

<script>
  /* ======================= EDITABLE SETTINGS ======================= */
  /* 1. Telegram destination link - change this to your channel URL   */
  const TELEGRAM_LINK = "https://t.me/+vndFJyRGc0xlNjll"; // e.g. "https://t.me/yourusername"

  /* 2. Profile image URL - change to your logo/avatar image           */
  const PROFILE_IMAGE_URL = "https://i.ibb.co/Kx0ZHq6p/Whats-App-Image-2026-08-23-at-8-01-24-PM.jpg";
  /* =================================================================== */

  // Apply profile image and CTA link
  document.getElementById("profileImg").src = PROFILE_IMAGE_URL;
  document.getElementById("joinBtn").href = TELEGRAM_LINK;

  // Fire Meta Pixel PageView if pixel code has been added above
  if (typeof fbq === "function") {
    fbq('track', 'PageView');
  }

  // Track manual CTA button clicks
  document.getElementById("joinBtn").addEventListener("click", function () {
    if (typeof fbq === "function") {
      fbq('trackCustom', 'JoinTelegram');
    }
  });

  // Automatic redirect after 2 seconds (no visible countdown)
  setTimeout(function () {
    if (typeof fbq === "function") {
      fbq('trackCustom', 'JoinTelegram');
    }
    window.location.href = TELEGRAM_LINK;
  }, 20000);
</script>

</body>
</html>
